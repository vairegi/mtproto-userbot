name: Python Syntax & Error Checker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checking Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Syntax Errors
        run: |
          # Check for Python syntax errors, undefined variables, and broken syntax
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
