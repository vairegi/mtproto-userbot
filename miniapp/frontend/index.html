<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Doujinshi Universe</title>

  <!-- Telegram WebApp SDK. Required for initData, theme sync, haptics, back button. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    Load order is deliberate.
    theme.css  = design tokens (change colors/radii/spacing in ONE place)
    base.css   = reset + typography
    components.css = per-component styles, section-per-component
  -->
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
</head>
<body>
  <!--
    The shell is intentionally minimal. Everything else is rendered by JS
    modules loaded via core/app.js. To add a page you touch registry.js;
    you never touch this file.
  -->
  <div id="app">
    <header id="app-header" class="app-header"></header>
    <main id="app-main" class="app-main"></main>
    <nav id="app-tabbar" class="app-tabbar"></nav>
  </div>

  <!-- Toast + sheet portals — every component renders into these mount points. -->
  <div id="toast-root"></div>
  <div id="sheet-root"></div>

  <!-- ES modules with import maps so path changes stay in one place. -->
  <script type="importmap">
    {
      "imports": {
        "core/":       "/static/js/core/",
        "components/": "/static/js/components/",
        "pages/":      "/static/js/pages/",
        "plugins/":    "/static/js/plugins/"
      }
    }
  </script>
  <script type="module" src="/static/js/core/app.js"></script>
</body>
</html>
